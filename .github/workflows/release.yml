name: Release

on:
  push:
    # branches:
    #   - main
    tags: ["v*.*.*"]
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  build_platform:
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86
            files: |
              dist/*/*.exe
              dist/*/*.zip

          - os: macos-14
            platform: ios
            arch: all
            files: |
              dist/*/*.ipa
          
          # - os: macos-14
          #   platform: macos
          #   arch: all
          #   format: dmg,zip
          #   files: |
          #     dist/*/*.dmg
          #     dist/*/*.zip

    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml # path to pubspec.yaml or .fvmrc or .fvm/fvm_config.json
          cache: true

      # - name: Setup Rust toolchain
      #   uses: dtolnay/rust-toolchain@stable
      #   with:
      #     toolchain: stable

      # - name: Install Xcode
      #   if: ${{matrix.platform == 'ios'}}
      #   uses: maxim-lobanov/setup-xcode@v1
      #   with:
      #     xcode-version: "16.2"

      - name: Install ${{matrix.platform}} dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=${{matrix.platform}} --arch=${{matrix.arch}}

      - name: Build ${{matrix.platform}} binaries
        run: dart cli/cli.dart build --arch=${{matrix.arch}} ${{matrix.platform}}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{matrix.platform}}-${{matrix.arch}}
          path: ${{matrix.files}}

  upload:
    runs-on: ubuntu-22.04
    needs:
      - build_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./Release-Binaries

      - name: Install dependencies
        run: sudo apt-get install tree -y

      - name: Generate Checksums
        run: |
          tree .
          find Release-Binaries -type f -exec md5sum {} \; >> RELEASE.md5sum
          find Release-Binaries -type f -exec sha256sum {} \; >> RELEASE.sha256sum
          sed -i 's|Release-Binaries/.*/\([^/]*\)$|\1|' RELEASE.sha256sum RELEASE.md5sum
          sed -i 's|Release-Binaries/||' RELEASE.sha256sum RELEASE.md5sum

      - name: Extract pubspec version
        run: |
          echo "PUBSPEC_VERSION=$(grep -oP 'version:\s*\K[^+]+(?=\+)' pubspec.yaml)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: sums
          path: |
            RELEASE.md5sum
            RELEASE.sha256sum

      - name: Upload Release Binaries (stable)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.PUBSPEC_VERSION }} # mind the "v" prefix
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: Release-Binaries/**/*,RELEASE.sha256sum,RELEASE.md5sum

  cleanup:
    runs-on: ubuntu-latest
    needs:
      - upload
    strategy:
      matrix:
        keep: [5, 10, 20]  # 不同保留策略
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean Releases
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // 配置
            const keepLatest = ${{ matrix.keep }};
            const keepYoungerThanDays = 30;
            const now = new Date();
            
            // 过滤和排序
            const sortedReleases = releases
              .filter(release => !release.draft)  // 跳过草稿
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            let deleted = 0;
            for (let i = 0; i < sortedReleases.length; i++) {
              const release = sortedReleases[i];
              const created = new Date(release.created_at);
              const ageDays = (now - created) / (1000 * 60 * 60 * 24);
              
              // 保留条件
              if (i < keepLatest || ageDays < keepYoungerThanDays) {
                console.log(`保留: ${release.tag_name} (${ageDays.toFixed(0)} 天)`);
                continue;
              }
              
              // 删除
              console.log(`删除: ${release.tag_name} (${ageDays.toFixed(0)} 天)`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                deleted++;
              } catch (error) {
                console.error(`删除失败: ${error.message}`);
              }
            }
            
            console.log(`总计删除了 ${deleted} 个 release`);