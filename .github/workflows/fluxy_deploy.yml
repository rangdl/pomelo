name: Fluxy Cloud Deployment

on:
  push:
    # branches:
    #   - main
    tags: ["v*.*.*"]
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      # build_linux:
      #   description: '构建 Linux (x64)'
      #   type: boolean
      #   default: true
      build_windows:
        description: '构建 Windows (x64)'
        type: boolean
        default: true
      # build_macos:
      #   description: '构建 macOS (Universal)'
      #   type: boolean
      #   default: true
      # build_android:
      #   description: '构建 Android (APK)'
      #   type: boolean
      #   default: true
      # build_ios:
      #   description: '构建 iOS (No Codesign)'
      #   type: boolean
      #   default: true
      # build_web:
      #   description: '构建 Web (standalone + embedded)'
      #   type: boolean
      #   default: true

jobs:
  build_and_deploy:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86
            files: |
              dist/Pomelo-windows-x64.zip

    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version-file: pubspec.yaml # path to pubspec.yaml or .fvmrc or .fvm/fvm_config.json
          cache: true
          # optional parameters follow
          # pub-cache: true # optional, defaults to empty (falls back to cache value for backward compatibility)
          # cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          # cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          # pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache of dart pub get dependencies
          # pub-cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          # git-source: https://github.com/flutter/flutter.git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Xcode
        if: ${{matrix.platform == 'ios'}}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: Install fastforge
        run: dart pub global activate fastforge
      - run: flutter pub get
      - name: Extract version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line
          $version = ($versionLine -replace 'version:\s*', '') -replace '\+.*', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      - run: flutter build windows --release --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }}
      - name: Package ZIP (绿色便携包)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Pomelo-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{matrix.platform}}-${{matrix.arch}}
          path: ${{matrix.files}}

