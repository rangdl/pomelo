name: pomelo
description: "Pomelo - 基于可插拔音源插件的跨平台音乐播放器。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.8
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  liquid_glass_widgets: ^1.19.0
  media_kit: ^1.2.6
  media_kit_libs_android_audio: ^1.3.8
  media_kit_libs_windows_audio: ^1.0.9
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  quickjs_engine:
    path: third_party/quickjs_engine
  url_launcher: ^6.3.3
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  # 真机集成测试需要读取这两个真实音源脚本（设备上无源码目录，须随包打进 assets）。
  assets:
    - scripts/xinghai-music-source-qs-v1.3.0.js
    - scripts/xinghai-music-sourcev2.3.19.js
